name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ==================== 构建各平台产物 ====================
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.8.10"

      - name: Install dependencies
        run: uv sync --no-group dev

      # ============================================================
      #                       Windows 构建
      # ============================================================
      - name: Build with Nuitka (Windows)
        if: matrix.platform == 'windows'
        run: >
          uv run nuitka
          --standalone
          --enable-plugin=pyside6
          --windows-disable-console
          --output-dir=dist
          --jobs=4
          --lto=yes
          --nofollow-import-to=pytest,ruff,ty
          --mingw64
          --noinclude-qt-translations
          --windows-icon-from-ico=assets/icon.ico
          --assume-yes-for-downloads
          src/main.py

      - name: Install Inno Setup (Windows)
        if: matrix.platform == 'windows'
        run: choco install innosetup -y --no-progress

      - name: Build Windows Installer
        if: matrix.platform == 'windows'
        working-directory: packaging
        run: iscc installer.iss

      - name: Upload Windows installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*.exe
          if-no-files-found: error

      # ============================================================
      #                       macOS 构建
      # ============================================================
      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          uv sync --no-group dev
      
      - name: Build with Nuitka (macOS)
        if: matrix.platform == 'macos'
        run: >
          uv run nuitka
          --standalone
          --enable-plugin=pyside6
          --macos-create-app-bundle
          --macos-app-icon=assets/icon.png
          --output-dir=dist
          --jobs=$(sysctl -n hw.ncpu)
          --lto=yes
          --nofollow-import-to=pytest,ruff,ty
          --noinclude-qt-translations
          --assume-yes-for-downloads
          src/main.py

      - name: Install dmgbuild (macOS)
        if: matrix.platform == 'macos'
        run: uv pip install dmgbuild

      - name: Build macOS DMG
        if: matrix.platform == 'macos'
        run: |
          uv run dmgbuild -s packaging/dmg_settings.py "Apsat" dist/apsat-macos.dmg
          uv run dmgbuild -s packaging/dmg_settings.py "Apsat" dist/apsat-macos-${{ github.event.inputs.tag }}.dmg

      - name: Upload macOS DMG
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: dist/*.dmg
          if-no-files-found: error

      # ============================================================
      #                       Linux 构建
      # ============================================================
      - name: Build with Nuitka (Linux)
        if: matrix.platform == 'linux'
        run: >
          uv run nuitka
          --standalone
          --enable-plugin=pyside6
          --output-dir=dist
          --jobs=$(nproc)
          --lto=yes
          --nofollow-import-to=pytest,ruff,ty
          --noinclude-qt-translations
          --assume-yes-for-downloads
          src/main.py

      # ---------- 准备打包目录 ----------
      - name: Prepare packaging directory (Linux)
        if: matrix.platform == 'linux'
        run: |
          # 程序文件
          mkdir -p pkgroot/opt/apsat
          cp -r dist/main.dist/* pkgroot/opt/apsat/

          # 启动脚本
          mkdir -p pkgroot/usr/bin
          cat > pkgroot/usr/bin/apsat << 'EOF'
          #!/bin/bash
          exec /opt/apsat/main "$@"
          EOF
          chmod +x pkgroot/usr/bin/apsat

          # 桌面入口
          mkdir -p pkgroot/usr/share/applications
          cp packaging/apsat.desktop pkgroot/usr/share/applications/apsat.desktop

          # 图标
          mkdir -p pkgroot/usr/share/icons/hicolor/256x256/apps
          cp assets/icon.png pkgroot/usr/share/icons/hicolor/256x256/apps/apsat.png

          # 验证结构
          find pkgroot -type f

      # ---------- 构建 .deb 和 .rpm ----------
      - name: Install fpm (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install fpm

      - name: Build .deb package
        if: matrix.platform == 'linux'
        run: |
          VERSION="${{ github.event.inputs.tag }}"
          fpm -s dir -t deb \
            -n apsat \
            -v "$VERSION" \
            --description "Automated Player Skin Acquisition Tool" \
            --url "https://github.com/Deswatts/Apsat" \
            --license "GPLv3" \
            --maintainer "Deswatts" \
            --depends "libc6" \
            --depends "libxcb1" \
            --depends "libx11-6" \
            --depends "libgl1" \
            --depends "libegl1" \
            --depends "libxkbcommon0" \
            --depends "libdbus-1-3" \
            --depends "libfontconfig1" \
            -C pkgroot \
            -p dist/apsat_${VERSION}_amd64.deb \
            .

      - name: Build .rpm package
        if: matrix.platform == 'linux'
        run: |
          VERSION="${{ github.event.inputs.tag }}"
          fpm -s dir -t rpm \
            -n apsat \
            -v "$VERSION" \
            --description "Automated Player Skin Acquisition Tool" \
            --url "https://github.com/Deswatts/Apsat" \
            --license "GPLv3" \
            --maintainer "Deswatts" \
            --depends "glibc" \
            --depends "libxcb" \
            --depends "libX11" \
            --depends "mesa-libGL" \
            --depends "mesa-libEGL" \
            --depends "libxkbcommon" \
            --depends "dbus-libs" \
            --depends "fontconfig" \
            -C pkgroot \
            -p dist/apsat-${VERSION}-1.x86_64.rpm \
            .

      # ---------- AppImage（保留原有逻辑） ----------
      - name: Prepare AppDir (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/main.dist/* AppDir/usr/bin/
          cp assets/icon.png AppDir/apsat.png
          cp packaging/apsat.desktop AppDir/apsat.desktop

          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/main" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Download appimagetool (Linux)
        if: matrix.platform == 'linux'
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        run: |
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir dist/apsat-linux-${GITHUB_REF_NAME#v}-x86_64.AppImage

      # ---------- 上传所有 Linux 产物 ----------
      - name: Upload Linux packages
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  # ==================== 创建 Release ====================
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          files: artifacts/**
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
